version: '3.8'

services:
  api:
    build: .
    ports:
      - "8001:8001"
    environment:
      - DATABASE_URL=postgresql://creditrisk_user:creditrisk123@db/creditrisk_db
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:15
    environment:
      - POSTGRES_DB=creditrisk_db
      - POSTGRES_USER=creditrisk_user
      - POSTGRES_PASSWORD=creditrisk123
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U creditrisk_user -d creditrisk_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: