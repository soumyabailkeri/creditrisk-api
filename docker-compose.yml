version: '3.8'

services:
  api:
    build: .
    ports:
      - "8001:8001"
    environment:
      - DATABASE_URL=postgresql://creditrisk_user:creditrisk123@db/creditrisk_db
    depends_on:
      - db

  db:
    image: postgres:15
    environment:
      - POSTGRES_DB=creditrisk_db
      - POSTGRES_USER=creditrisk_user
      - POSTGRES_PASSWORD=creditrisk123
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: